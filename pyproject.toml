[project]
name = "loopbrake"
version = "0.0.0"
description = "Stops stuck AI agent runs, with a guaranteed limit on stopping good ones."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopbrake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
