<!doctype html>
<html lang="en" data-glass="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LoopBrake</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="refract" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="phone-top">
      <a class="brand" href="#/"><span>LoopBrake</span></a>
    </header>
    <nav class="side glass" aria-label="Main">
      <a class="brand" href="#/"><span>LoopBrake</span></a>
      <a class="nav" href="#/" data-nav="home"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#house"/></svg><span>Home</span></a>
      <a class="nav" href="#/tasks" data-nav="tasks"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#list"/></svg><span>Tasks</span></a>
      <a class="nav" href="#/projects" data-nav="projects"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#folder"/></svg><span>Projects</span></a>
      <a class="nav" href="#/settings" data-nav="settings"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#settings"/></svg><span>Settings</span></a>
      <p class="side-note"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#eye"/></svg><span>Only this computer can open this page.</span></p>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog class="dialog glass" id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel" class="button quiet">Cancel</button>
        <button value="ok" class="button" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
