<!doctype html>
<html lang="en" data-glass="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>LoopBrake</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="refract" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar glass">
    <a class="brand" href="#/" aria-label="LoopBrake overview">
      <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#octagon-x"/></svg>
      <span>LoopBrake</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="overview"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#house"/></svg><span>Overview</span></a>
      <a href="#/projects" data-nav="projects"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#folder"/></svg><span>Projects</span></a>
      <a href="#/export" data-nav="export"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#send"/></svg><span>Export</span></a>
    </nav>
    <button class="toggle" id="glass" type="button" aria-pressed="true">
      <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#blend"/></svg><span>Glass</span>
    </button>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog class="dialog glass" id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel" class="button quiet">Cancel</button>
        <button value="ok" class="button" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
