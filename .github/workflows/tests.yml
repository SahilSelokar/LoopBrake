name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --python ${{ matrix.python }} pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: The wheel holds only the public library
        run: |
          extra=$(python3 -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); print('\n'.join(n for n in names if not (n.startswith('loopbrake/') or '.dist-info/' in n)))")
          if [ -n "$extra" ]; then echo "unexpected files in the wheel:"; echo "$extra"; exit 1; fi
